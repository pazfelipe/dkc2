<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DKC2 Study Port</title>
    <style>
      :root {
        --bg: #0e0c0a;
        --fg: #efe6d6;
        --muted: #a39580;
        --accent: #e8b23a;
        --panel: #1b1713;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
      #loading { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; color: var(--muted); text-align: center; }
      #game { min-height: 100%; display: grid; place-items: center; }
      #screen { width: min(100vw, calc(100vh * 256 / 224 * 8 / 7)); aspect-ratio: 256 * 8 / 7 / 224; aspect-ratio: 1.306; image-rendering: pixelated; background: #000; }
      #debug { position: fixed; top: 8px; left: 8px; margin: 0; padding: 8px 10px; background: rgba(0,0,0,.7); color: #b8f0b0; font: 12px/1.4 ui-monospace, monospace; white-space: pre; border-radius: 6px; }
      #toast { position: fixed; top: 12px; right: 12px; background: rgba(0,0,0,.75); color: var(--fg); padding: 6px 12px; border-radius: 6px; font-size: 13px; }
      #help { position: fixed; bottom: 8px; right: 12px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <section id="loading">Loading…</section>
    <section id="game" hidden>
      <canvas id="screen" width="1024" height="896"></canvas>
      <pre id="debug" hidden></pre>
      <div id="toast" hidden></div>
      <div id="help">Arrows move · Z jump · A run/roll · X team-up · Enter start · Shift swap · F2/F4 save/load state · ` debug · P pause · H HD on/off</div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
